<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boîte à outils JavaScript</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand">Garage automobile — Cote et plaques</span>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card h-100"><div class="card-body">
          <h2 class="h5">📉 Cote</h2>
          <div class="row g-2">
            <div class="col"><input id="valeur" type="number" class="form-control" placeholder="valeur"></div>
            <div class="col"><input id="annèes" type="number" class="form-control" placeholder="annèes"></div>
            <div class="col"><input id="seuil" type="number" class="form-control" placeholder="seuil"></div>
            <div class="col-auto"><button id="btn-Estimer" class="btn btn-primary">Estimer</button></div>
          </div>
          <div id="res-denombrement" class="d-none"></div>
        </div></div>
      </div>
      <div class="col-lg-6">
        <div class="card h-100"><div class="card-body">
          <h2 class="h5">🔧 Entretien</h2>
          <div class="row g-2">
            <div class="col"><input id="vid" type="number" class="form-control" placeholder="km vidange"></div>
            <div class="col"><input id="pneu" type="number" class="form-control" placeholder="km pneus"></div>
            <div class="col-auto"><button id="btn-calculer" class="btn btn-primary">Calculer</button></div>
          </div>
          <div id="res-calculer" class="d-none"></div>
        </div></div>
      </div>
      <div class="col-lg-6">
        <div class="card h-100"><div class="card-body">
          <h2 class="h5">🚘 Véhicule</h2>
          <div class="row g-2">
            <div class="col"><input id="plaque" type="text" class="form-control" placeholder="plaque"></div>
            <div class="col"><input id="num" type="text" class="form-control" placeholder="numèro de sèrie"></div>
            <div class="col-auto"><button id="btn-Générer" class="btn btn-primary">Générer</button></div>
          </div>
          <div id="res-Générer" class="d-none"></div>
        </div></div>
      </div>
  </main>
  <script src="js/outils.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
